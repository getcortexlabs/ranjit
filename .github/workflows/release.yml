name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ranjit
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: ranjit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ranjit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RANJIT_TEST_POSTGRES_URL: postgres://ranjit:test-only-password@localhost:5432/ranjit?sslmode=disable
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
      - run: make check build
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build release archives
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python3 scripts/release.py --version "$RELEASE_VERSION"
      - name: Build and smoke-test container
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          docker build --build-arg VERSION="$RELEASE_VERSION" -t ranjit:release .
          docker run --rm -v ranjit_test:/data ranjit:release demo
          docker run --rm -v ranjit_test:/data ranjit:release doctor
          docker volume rm ranjit_test
          cp .env.example .env
          sed -i "s/^RANJIT_API_KEY=$/RANJIT_API_KEY=$(openssl rand -hex 32)/" .env
          docker compose up --build --wait --wait-timeout 120
          make smoke
          docker compose down --volumes
      - name: Export images for installation without a registry account
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          docker buildx create --use --name ranjit-release
          for arch in amd64 arm64; do
            artifact="dist/ranjit_${RELEASE_VERSION}_linux_${arch}.docker.tar"
            docker buildx build --platform "linux/$arch" --build-arg VERSION="$RELEASE_VERSION" --tag "ghcr.io/getcortexlabs/ranjit:$RELEASE_VERSION" --output "type=docker,dest=$artifact" .
            gzip -n "$artifact"
          done
          (cd dist && sha256sum *.docker.tar.gz >> checksums.txt)
          sha256sum compose.quick.yaml >> dist/checksums.txt
          docker load --input "dist/ranjit_${RELEASE_VERSION}_linux_amd64.docker.tar.gz"
          docker compose -f compose.quick.yaml up -d --wait --wait-timeout 60
          docker compose -f compose.quick.yaml exec -T ranjit /ranjit demo
          docker compose -f compose.quick.yaml exec -T ranjit /ranjit doctor
          docker compose -f compose.quick.yaml down --volumes
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" dist/* install.sh compose.quick.yaml --verify-tag --title "Ranjit $RELEASE_VERSION" --notes-file docs/release-notes.md
      - name: Publish container image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$RELEASE_VERSION" --tag "ghcr.io/getcortexlabs/ranjit:$RELEASE_VERSION" --tag ghcr.io/getcortexlabs/ranjit:latest --push .
